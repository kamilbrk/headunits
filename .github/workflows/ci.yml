name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx astro check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke test built artifacts
        run: |
          set -e
          for path in \
            dist/index.html \
            dist/404.html \
            dist/search/index.html \
            dist/safety/index.html \
            dist/contribute/index.html \
            dist/glossary/index.html \
            dist/themes/ksw/index.html \
            dist/themes/zxw/index.html \
            dist/themes/bmw/index.html \
            dist/themes/help-wanted/index.html \
            dist/updates/ksw/index.html \
            dist/updates/zxw/index.html \
            dist/platforms/index.html \
            dist/platforms/ksw/index.html \
            dist/platforms/zxw/index.html \
            dist/platforms/ksw/m600/index.html \
            dist/factory-settings/ksw/index.html \
            dist/factory-settings/zxw/index.html \
            dist/faq/ksw/index.html \
            dist/faq/zxw/index.html \
            dist/upgrade-path/ksw/index.html \
            dist/upgrade-path/zxw/index.html \
            dist/faq/ksw/upgrade-path/index.html \
            dist/sitemap-index.xml \
            dist/rss.xml \
            dist/og-image.jpg \
            dist/pagefind/pagefind-ui.js \
            dist/pagefind/pagefind-ui.css
          do
            test -s "$path" || { echo "Missing or empty: $path"; exit 1; }
          done
      - name: Validate built HTML
        run: npm run check:html
      - name: Check internal links
        run: npm run check:links
      - name: Check inline spacing
        run: npm run check:spacing
      - name: Check generated links
        run: npm run check:autolinks
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  # A separate job: a flaky browser test should not hold up the deploy, which
  # `verify` alone gates.
  e2e:
    runs-on: ubuntu-latest
    # The browsers and their system dependencies are already in this image, so
    # there is no `playwright install` step. Keep the tag in step with the
    # `@playwright/test` version in package.json: a mismatch means the package
    # looks for a browser build the image does not carry.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001 --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # The image's Node is outside our control and moves with the tag, so a
      # drift below the repo's floor is caught here rather than as a confusing
      # failure further down.
      - name: Check the image's Node against the repo floor
        run: |
          node --version
          node -e "
            const [major, minor] = process.versions.node.split('.').map(Number);
            if (major < 24 || (major === 24 && minor < 16)) {
              console.error('Node ' + process.versions.node + ' is below the >=24.16.0 floor in package.json');
              process.exit(1);
            }"
      - name: Cache npm downloads
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Install dependencies
        run: npm ci
      # Dependabot bumps the package but not the image tag above, and the
      # mismatch would otherwise surface as a missing browser build.
      - name: Check the image tag matches @playwright/test
        run: |
          node -e "
            const wanted = require('./package.json').devDependencies['@playwright/test'];
            const image = 'mcr.microsoft.com/playwright:v1.63.0-noble';
            if (!image.includes('v' + wanted + '-')) {
              console.error('Image ' + image + ' does not match @playwright/test ' + wanted);
              process.exit(1);
            }"
      - name: Build
        run: npm run build
      - name: End-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Serialize Pages deploys so rapid pushes don't collide on the
    # single-flight GitHub Pages deploy endpoint.
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
